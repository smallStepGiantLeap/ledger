apiVersion: vikrant.smallstepgiantleap.dev/v1alpha1
kind: Service
metadata:
  name: ledger
spec:
  language: go
  proto: proto/ledger/v1/ledger.proto
  authorizedCallers:
    - service: smallStepGiantLeap/echo
      methods: [ledger.v1.LedgerService/GetBalance]
  ingress:
    - service: smallStepGiantLeap/echo
  egress:
    # A payment processor: a dependency outside the mesh, reached over TLS.
    - host: api.stripe.com:443

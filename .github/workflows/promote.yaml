# Generated by vikrant v0.1.0. Do not edit: platform-owned.
#
# Promotion copies the image one environment runs to the next one, as a
# pull request: the digest that passed there is the only thing that moves.
# dev -> staging -> prod
name: promote
on:
  workflow_dispatch:
    inputs:
      to:
        description: environment to promote into
        type: choice
        options:
          - staging
          - prod
permissions:
  contents: write
  pull-requests: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Copy the image from the previous environment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TO: ${{ inputs.to }}
        run: |
          order=(dev staging prod )
          from=""
          for i in "${!order[@]}"; do
            if [[ "${order[$i]}" == "$TO" && $i -gt 0 ]]; then from="${order[$((i - 1))]}"; fi
          done
          [[ -n "$from" ]] || { echo "nothing precedes $TO"; exit 1; }
          image="$(sed -n 's#^  value: ##p' "deploy/envs/$from/image.yaml")"
          sed -i "s#^  value: .*#  value: $image#" "deploy/envs/$TO/image.yaml"
          git diff --quiet && { echo "$TO already runs $image"; exit 0; }
          branch="promote/$TO"
          git -c user.name="vikrant delivery" -c user.email="delivery@users.noreply.github.com" \
            commit -q -am "delivery: $TO runs what $from runs" -m "$image"
          git push -q -f origin "HEAD:$branch"
          # Creating the pull request needs the organisation to allow
          # Actions to open pull requests; otherwise the branch is ready.
          gh pr create --head "$branch" --title "Promote ledger to $TO" \
            --body "Promotes the image $from runs to $TO: \`$image\`." ||
            echo "Open a pull request from $branch: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$branch"

# A single Prometheus, written by hand so every scrape rule is readable.
#
# Alternative not taken: kube-prometheus-stack (Helm). It brings the Prometheus
# Operator, ServiceMonitor CRDs, node-exporter, kube-state-metrics and a set of
# generated Grafana dashboards. That is the right choice for a real cluster and
# the wrong one for a repository whose rule is "no config you cannot read".
#
# Discovery: every pod annotated prometheus.io/scrape: "true" is scraped at
# prometheus.io/port and prometheus.io/path. Istio (chapter 3) rewrites these
# same annotations on injected pods to point at its merged-metrics endpoint, so
# this one job keeps working once the mesh is installed.
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
  - apiGroups: [""]
    resources: [pods, services, endpoints, nodes]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      # Prometheus's default is 1m. 5s gives rate() windows of 15-30s enough
      # samples to be useful in a 30-60s experiment.
      scrape_interval: 5s
      evaluation_interval: 5s

    scrape_configs:
      - job_name: pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          # Only pods that opt in.
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            regex: "true"
            action: keep
          # Completed pods (e.g. a finished loadgen) have nothing to scrape.
          - source_labels: [__meta_kubernetes_pod_phase]
            regex: Succeeded|Failed
            action: drop
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            regex: (.+)
            target_label: __metrics_path__
          # Replace the discovered port with the annotated one. The pod role
          # yields one target per declared container port; after this rewrite
          # they are identical and Prometheus keeps one.
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          # Carry pod labels (app, version, pod-template-hash, and later
          # rollouts-pod-template-hash) onto every series.
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: quay.io/prometheus/prometheus:v3.15.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=12h
            # POST /-/reload re-reads the ConfigMap without a restart.
            - --web.enable-lifecycle
          ports:
            - name: web
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: web
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus
        # Metrics do not survive a Prometheus restart. Acceptable for
        # experiments that each last minutes.
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
spec:
  selector:
    app: prometheus
  ports:
    - name: web
      port: 9090
      targetPort: web
